<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Bloque 4</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0d0f14;
    --surface: #151820;
    --surface2: #1c2030;
    --border: #2a3040;
    --accent: #4af0c0;
    --accent2: #f04a7a;
    --accent3: #f0c04a;
    --text: #e8eaf0;
    --text-muted: #6b7280;
    --correct: #22c55e;
    --wrong: #ef4444;
    --unanswered: #6b7280;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }

  .header {
    width: 100%;
    max-width: 780px;
    margin-bottom: 32px;
    text-align: center;
  }

  .header h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 800;
    letter-spacing: -1px;
    color: var(--accent);
    text-shadow: 0 0 40px rgba(74,240,192,0.3);
  }

  .header .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 6px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Progress bar */
  .progress-wrap {
    width: 100%;
    max-width: 780px;
    margin-bottom: 20px;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #4af0f0);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* Card */
  .card {
    width: 100%;
    max-width: 780px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 36px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), #4af0f0, var(--accent2));
  }

  .question-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .question-category {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--text-muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 8px;
    display: inline-block;
    margin-bottom: 16px;
  }

  .question-text {
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.6;
    margin-bottom: 28px;
    color: var(--text);
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    text-align: left;
    width: 100%;
    font-family: 'Syne', sans-serif;
    font-size: 0.95rem;
    color: var(--text);
    line-height: 1.5;
    user-select: none;
  }

  .option:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(74,240,192,0.05);
    transform: translateX(3px);
  }

  .option:disabled { cursor: default; transform: none; }

  .opt-letter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--accent);
    min-width: 22px;
    padding-top: 1px;
  }

  .option.correct {
    border-color: var(--correct);
    background: rgba(34,197,94,0.1);
  }
  .option.correct .opt-letter { color: var(--correct); }

  .option.wrong {
    border-color: var(--wrong);
    background: rgba(239,68,68,0.1);
  }
  .option.wrong .opt-letter { color: var(--wrong); }

  .option.reveal-correct {
    border-color: var(--correct);
    background: rgba(34,197,94,0.06);
  }

  /* Feedback */
  .feedback {
    margin-top: 20px;
    padding: 12px 18px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 1px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct-fb {
    background: rgba(34,197,94,0.12);
    border: 1px solid var(--correct);
    color: var(--correct);
  }
  .feedback.wrong-fb {
    background: rgba(239,68,68,0.12);
    border: 1px solid var(--wrong);
    color: var(--wrong);
  }

  /* Nav */
  .nav {
    width: 100%;
    max-width: 780px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    gap: 12px;
  }

  .btn {
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    padding: 12px 28px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.3; cursor: default; }

  .btn-prev {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-prev:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }

  .btn-next {
    background: var(--accent);
    color: #0d0f14;
  }
  .btn-next:hover:not(:disabled) { opacity: 0.85; }

  .btn-finish {
    background: var(--accent2);
    color: #fff;
  }

  /* Results */
  .results {
    width: 100%;
    max-width: 780px;
    display: none;
  }

  .results.show { display: block; }

  .results-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .results-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent3), var(--accent), var(--accent2));
  }

  .results-title {
    font-size: 1.8rem;
    font-weight: 800;
    margin-bottom: 8px;
    color: var(--accent);
  }

  .results-score-big {
    font-family: 'JetBrains Mono', monospace;
    font-size: 4rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    margin: 24px 0;
    text-shadow: 0 0 40px rgba(74,240,192,0.4);
  }

  .results-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin: 28px 0;
  }

  .stat-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 12px;
  }

  .stat-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2rem;
    font-weight: 700;
    line-height: 1;
  }

  .stat-val.c { color: var(--correct); }
  .stat-val.w { color: var(--wrong); }
  .stat-val.u { color: var(--unanswered); }

  .stat-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .btn-restart {
    background: var(--accent);
    color: #0d0f14;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    padding: 14px 40px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 16px;
    transition: opacity 0.2s;
  }
  .btn-restart:hover { opacity: 0.85; }

  /* Question nav dots */
  .dot-nav {
    width: 100%;
    max-width: 780px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }

  .dot {
    width: 24px; height: 24px;
    border-radius: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .dot:hover { border-color: var(--accent); }
  .dot.active { border-color: var(--accent); color: var(--accent); background: rgba(74,240,192,0.08); }
  .dot.answered-correct { background: rgba(34,197,94,0.2); border-color: var(--correct); color: var(--correct); }
  .dot.answered-wrong { background: rgba(239,68,68,0.2); border-color: var(--wrong); color: var(--wrong); }

  @media (max-width: 600px) {
    .card { padding: 24px 18px; }
    .results-grid { grid-template-columns: 1fr; }
    .results-score-big { font-size: 3rem; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>TEST BLOQUE 4</h1>
  <div class="subtitle">Redes · Linux · Windows · BBDD · Virtualización</div>
</div>

<div class="dot-nav" id="dotNav"></div>

<div class="progress-wrap">
  <div class="progress-meta">
    <span id="progressLabel">Pregunta 1 de N</span>
    <span id="progressPct">0%</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<!-- Quiz -->
<div class="card" id="quizCard">
  <div class="question-num" id="qNum"></div>
  <div class="question-category" id="qCat"></div>
  <div class="question-text" id="qText"></div>
  <div class="options" id="optionsContainer"></div>
  <div class="feedback" id="feedback"></div>
</div>

<div class="nav">
  <button class="btn btn-prev" id="btnPrev" onclick="go(-1)">← Anterior</button>
  <button class="btn btn-next btn-finish" id="btnNext" onclick="goNext()">Siguiente →</button>
</div>

<!-- Results -->
<div class="results" id="results">
  <div class="results-card">
    <div class="results-title">🎯 Resultado Final</div>
    <div class="results-score-big" id="scorePercent"></div>
    <div class="results-grid">
      <div class="stat-box">
        <div class="stat-val c" id="statCorrect">0</div>
        <div class="stat-label">✅ Correctas</div>
      </div>
      <div class="stat-box">
        <div class="stat-val w" id="statWrong">0</div>
        <div class="stat-label">❌ Incorrectas</div>
      </div>
      <div class="stat-box">
        <div class="stat-val u" id="statUnanswered">0</div>
        <div class="stat-label">⬜ Sin contestar</div>
      </div>
    </div>
    <button class="btn-restart" onclick="restart()">↺ Reiniciar Test</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'bloque4_state_v2';

const questions = [
  // ── SUBNETTING / REDES ──
  {cat:"Redes · Subnetting", q:"Primera IP disponible para asignar a un host de la red a la que pertenece el host 172.30.23.0/20:", opts:["172.30.8.1","172.30.14.1","172.30.16.1","172.30.23.1"], ans:2},
  {cat:"Redes · Subnetting", q:"¿Cuál de las siguientes direcciones estaría dentro del rango de direcciones privadas?", opts:["192.132.1.1","172.23.18.1","144.168.37.3","92.123.47.8"], ans:1},
  {cat:"Redes · Subnetting", q:"Tenemos esta dirección 10.1.x.x/255.255.0.0. ¿Máscara de red apropiada para planificar 52 subredes?", opts:["255.255.236.0","255.255.240.0","255.255.248.0","255.255.252.0"], ans:3},
  {cat:"Redes · Subnetting", q:"Tiene este direccionamiento 10.48.100.0/24, para 3 edificios: uno con 100 direcciones IP y los otros dos con necesidad de aproximadamente 25 direcciones. ¿Cuál de las siguientes es la mejor solución?", opts:["10.48.100.0/26, 10.48.100.128/27 y 10.48.100.160/28","10.48.100.0/25, 10.48.100.128/26 y 10.48.100.192/26","10.48.100.0/25, 10.48.100.128/27 y 10.48.100.160/27","10.48.100.0/26, 10.48.100.128/27 y 10.48.100.192/28"], ans:2},
  {cat:"Redes · Subnetting", q:"¿Cuál de las siguientes no puede ser una dirección IP pública de Internet?", opts:["217.9.215.1","197.165.276.1","162.198.207.3","174.158.254.203"], ans:1},
  {cat:"Redes · Subnetting", q:"Indique cuál, de entre las siguientes, es una dirección de loopback:", opts:["10000000.00000000.00000000.00000001","01111111.00000000.00000000.00000001","01111110.01111111.00000000.00000001","11111110.01111111.01111111.00000001"], ans:1},
  {cat:"Redes · Subnetting", q:"En una clase C son necesarias 18 subredes con el requisito de tener el mayor número de hosts posible. ¿Qué máscara de subred sería la adecuada?", opts:["255.255.255.192","255.255.255.224","255.255.255.240","255.255.255.248"], ans:3},
  {cat:"Redes · Subnetting", q:"Rango de direccionamiento IP: 10.200.10.128/28. ¿Cuál de los siguientes equipos NO tiene dirección IP correspondiente a ese rango?", opts:["10.200.10.130","10.200.10.135","10.200.10.140","10.200.10.145"], ans:3},
  {cat:"Redes · Subnetting", q:"La red 13.1.0.0 con máscara 255.255.192.0. ¿Cuántos bits tiene la máscara de red?", opts:["26","17","18","19"], ans:2},
  {cat:"Redes · Subnetting", q:"El direccionamiento 13.1.0.0/23. ¿Cuál es el número máximo de hosts disponible?", opts:["510","1022","254","2046"], ans:0},
  {cat:"Redes · IPv6", q:"¿Cuál es el prefijo para las direcciones unicast de enlace local en el protocolo IPv6?", opts:["::1/128","FF00::/8","FF80::/10","FE80::/10"], ans:3},
  {cat:"Redes · Subnetting", q:"Dado el direccionamiento 10.0.0.0/22, ¿cuál es el rango de hosts asignable?", opts:["10.0.0.1 - 10.0.3.254","10.3.1.0 - 10.3.254.255","10.0.0.1 - 10.0.7.254","10.0.0.1 - 10.0.15.254"], ans:0},
  {cat:"Redes · Subnetting", q:"¿Cuántos hosts son asignables en la siguiente subred 172.150.0.0/21?", opts:["1022","2046","510","1024"], ans:1},
  {cat:"Redes · Subnetting", q:"Para una subred con máscara 255.255.252.0, ¿cuántas direcciones de host se pueden asignar?", opts:["1022","2046","510","1024"], ans:0},
  {cat:"Redes · Subnetting", q:"¿Cuál es la wildcard de la dirección 122.240.14.15 con máscara 255.248.0.0?", opts:["0.7.255.255","0.0.7.255","0.255.255.255","0.0.255.255"], ans:0},
  {cat:"Redes · IPv6", q:"¿Qué dirección IPv6 no es correcta?", opts:["2001:0DB8::1428:57AB","2001:0DB8::1428:57AB","2001:0DB8:0:0:0:0:ABCD:57AB","2001:0DB8::1428:ABGD:57AB"], ans:3},
  {cat:"Redes · Subnetting", q:"¿De qué clase es la máscara de red 255.255.0.0?", opts:["Clase B","Clase A","Clase D","Clase C"], ans:0},
  {cat:"Redes · Subnetting", q:"¿Cuál de las siguientes direcciones IP puede pertenecer a la red Internet?", opts:["10.1.20.35","192.100.100.20","172.16.1.20","192.168.20.20"], ans:1},
  {cat:"Redes · Subnetting", q:"¿Cuál es la dirección de broadcast de la red a la que pertenece el host 172.30.23.0/21?", opts:["172.30.31.255","172.30.24.255","172.30.23.255","172.30.15.255"], ans:2},
  {cat:"Redes · Subnetting", q:"¿Qué dirección es inválida para un host de la subred a la que pertenece el host 192.168.31.55/28?", opts:["192.168.31.48","192.168.31.49","192.168.31.50","192.168.31.62"], ans:0},
  {cat:"Redes · Subnetting", q:"¿Cuál es la wildcard de la dirección 122.240.14.15 con máscara 255.224.0.0?", opts:["0.15.255.255","0.31.255.255","0.0.15.255","0.0.31.255"], ans:1},
  {cat:"Redes · Subnetting", q:"La red 10.0.4.0 con máscara 255.255.255.128. ¿Cuántos bits tiene la máscara de red?", opts:["24","26","25","23"], ans:2},
  {cat:"Redes · Subnetting", q:"Dado el direccionamiento 10.0.0.0/21, ¿cuál es el rango de hosts asignable?", opts:["10.0.3.1 - 10.0.3.254","10.0.0.1 - 10.0.0.254","10.0.3.0 - 10.0.3.255","10.0.0.1 - 10.0.7.254"], ans:3},

  // ── NORMATIVA ──
  {cat:"Normativa", q:"Según el artículo 9.3 de la Constitución Española, la Constitución garantiza:", opts:["El principio de legalidad, la retroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales...","El principio de legalidad, la irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos colectivos...","El principio de legalidad, la jerarquía normativa, la publicidad de las normas, la irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos individuales, la seguridad jurídica, la responsabilidad y la interdicción de la arbitrariedad de los poderes públicos","El principio de legalidad, la irretroactividad de las disposiciones sancionadoras, las condiciones para que la libertad e igualdad sean reales, la participación ciudadana..."], ans:2},
  {cat:"Normativa · ENI", q:"¿Cuál de las siguientes NO es una norma técnica de desarrollo del Esquema Nacional de Interoperabilidad contemplada en el RD 4/2010?", opts:["Norma técnica de política de gestión de documentos electrónicos","Norma técnica de requisitos de conexión a la red de comunicaciones de las AAPP","Norma técnica de interoperabilidad de tratamiento y preservación de bases de datos","Norma técnica de catálogo de servicios y aplicaciones"], ans:3},
  {cat:"Normativa · RD 203/2021", q:"Según el artículo 2 del Real Decreto 203/2021, por el que se aprueba el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, NO es uno de sus principios generales:", opts:["Proporcionalidad","Personalización y proactividad","Sostenibilidad","Interoperabilidad"], ans:2},

  // ── LINUX I ──
  {cat:"Linux · Arranque", q:"Está en modo gráfico (nivel 5). ¿Cómo pasar a modo texto, multiusuario y SIN los servicios de red?", opts:["Es el nivel 3. Teclee telinit 3 o init 3.","Es el nivel 2. Teclee telinit 2 o init 2.","Es el nivel 6. Teclee telinit 6 o init 6.","Es el nivel 10. Teclee telinit 10 o init 10."], ans:1},
  {cat:"Linux · Paquetes", q:"Seleccione la incorrecta en cuanto a administrador de paquetes por distribución correspondiente:", opts:["APT - UBUNTU","APT - DEBIAN","YUM - CENTOS","APT - RED HAT"], ans:3},
  {cat:"Linux · Comandos", q:"¿Qué comando debe insertar para programar una parada del servidor en 25 minutos?", opts:["shutdown -r +25","shutdown -h +25","shutdown -c +25","shutdown -k +25"], ans:1},
  {cat:"Linux · Comandos", q:"¿Qué comando debe ejecutar para conocer la versión exacta de su núcleo de Linux?", opts:["uname -v","grep kernel /var/log/messages","uname -r","dmesg |grep vmlinuz"], ans:2},
  {cat:"Linux · Arranque", q:"¿Cuál de los siguientes NO es un gestor de arranque de sistemas Linux?", opts:["LILO","STITCH","GRUB2","SYSLINUX"], ans:1},
  {cat:"Linux · Hardware", q:"¿Cómo conocer exactamente su modelo de procesador?", opts:["Cat /proc/procinfo","Cat /proc/cpuinfo","Cat /proc/meminfo","Cat /proc/net"], ans:1},
  {cat:"Linux · Paquetes", q:"En Linux, si fuese necesario eliminar un paquete instalado y su fichero de configuración, ¿qué opción debe usar el comando apt-get?", opts:["cleanup","uninstall","purge","auto-remove"], ans:2},
  {cat:"Linux · Paquetes", q:"Existen unas máquinas con Red Hat Enterprise Linux antiguo, y se necesitan listar los paquetes instalados. ¿Cómo lo haría?", opts:["Rpm -qi","Rpm -qa","Rpm -a","Rpm -al"], ans:1},
  {cat:"Linux · Paquetes", q:"Se desean actualizar todos los paquetes de RHEL (versión 5.5) a la última versión. ¿Cómo lo haría?", opts:["Apt-get update","Apt-get update all","Yum update","Yum latest"], ans:2},
  {cat:"Linux · Comandos", q:"¿Cómo podría, en Debian, obtener la información acerca de la memoria disponible?", opts:["Memory--show","Free -h","Cat /var/meminfo","Cat /proc/memory"], ans:1},
  {cat:"Linux · Paquetes", q:"Se necesita conocer más información acerca del paquete 'tzdata'. ¿Qué comando ejecutaría en Debian?", opts:["Apt-get show tzdata","Apt info tzdata","Dpk --info -r tzdata","Apt-cache show tzdata"], ans:3},
  {cat:"Linux · Paquetes", q:"Se necesita conocer si Tomcat ha sido instalado. ¿Cuál es la orden para obtener la información en servidores Linux?", opts:["Dpkg --get-selections | grep tomcat","Man --version tomcat","Cat /etc/tomcat_version","Vi /proc/tomcat"], ans:0},
  {cat:"Linux · Hardware", q:"De cara a poder configurar protecciones contra desbordamientos de buffer, necesita conocer información acerca del procesador en Debian. ¿Qué comando permite obtener dicha información?", opts:["getcpu","cat /proc/cpuinfo","cat /etc/processor","scancpu"], ans:1},
  {cat:"Linux · Paquetes", q:"Es necesario que se actualice el servidor S1 al último software disponible. ¿Cuál sería la orden que se debe ejecutar?", opts:["apt-get update; apt-get dist-upgrade","apt-get dist-install; apt-get update","apt-cache update; apt-dist upgrade","apt-dist-upgrade; apt-get install all"], ans:0},

// ── State ──
let current = 0;
let answers = [];
let locked = [];

function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) {
      const d = JSON.parse(s);
      if (d.answers && d.answers.length === questions.length) {
        answers = d.answers;
        locked = d.locked;
        current = d.current || 0;
        return;
      }
    }
  } catch(e){}
  answers = new Array(questions.length).fill(null);
  locked  = new Array(questions.length).fill(false);
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({answers, locked, current}));
  } catch(e){}
}

function render() {
  const q = questions[current];
  const n = questions.length;

  document.getElementById('qNum').textContent = `PREGUNTA ${current+1} DE ${n}`;
  document.getElementById('qCat').textContent = q.cat;
  document.getElementById('qText').textContent = q.q;

  // Progress
  const answered = answers.filter(a => a !== null).length;
  document.getElementById('progressLabel').textContent = `Pregunta ${current+1} de ${n}`;
  document.getElementById('progressPct').textContent = Math.round(answered/n*100) + '%';
  document.getElementById('progressFill').style.width = (answered/n*100) + '%';

  // Options
  const cont = document.getElementById('optionsContainer');
  cont.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.disabled = locked[current];
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;

    if (locked[current]) {
      if (i === q.ans) btn.classList.add(answers[current] === i ? 'correct' : 'reveal-correct');
      else if (i === answers[current]) btn.classList.add('wrong');
    }

    btn.onclick = () => selectAnswer(i);
    cont.appendChild(btn);
  });

  // Feedback
  const fb = document.getElementById('feedback');
  if (locked[current] && answers[current] !== null) {
    fb.className = 'feedback show ' + (answers[current] === q.ans ? 'correct-fb' : 'wrong-fb');
    fb.textContent = answers[current] === q.ans
      ? '✅ ¡CORRECTO!'
      : `❌ INCORRECTO — La respuesta correcta era: ${letters[q.ans]}) ${q.opts[q.ans]}`;
  } else {
    fb.className = 'feedback';
  }

  // Nav buttons
  document.getElementById('btnPrev').disabled = current === 0;
  const btnNext = document.getElementById('btnNext');
  if (current === n - 1) {
    btnNext.textContent = '🏁 Finalizar';
    btnNext.classList.add('btn-finish');
  } else {
    btnNext.textContent = 'Siguiente →';
    btnNext.classList.remove('btn-finish');
  }

  // Dots
  renderDots();
}

function renderDots() {
  const nav = document.getElementById('dotNav');
  nav.innerHTML = '';
  questions.forEach((_, i) => {
    const d = document.createElement('button');
    d.className = 'dot';
    d.textContent = i+1;
    if (i === current) d.classList.add('active');
    if (locked[i] && answers[i] !== null) {
      d.classList.add(answers[i] === questions[i].ans ? 'answered-correct' : 'answered-wrong');
    }
    d.onclick = () => { current = i; render(); };
    nav.appendChild(d);
  });
}

function selectAnswer(idx) {
  if (locked[current]) return;
  answers[current] = idx;
  locked[current] = true;
  saveState();
  render();
}

function go(dir) {
  const next = current + dir;
  if (next < 0 || next >= questions.length) return;
  current = next;
  saveState();
  render();
}

function goNext() {
  if (current === questions.length - 1) {
    showResults();
  } else {
    go(1);
  }
}

function showResults() {
  document.getElementById('quizCard').style.display = 'none';
  document.querySelector('.nav').style.display = 'none';
  document.getElementById('dotNav').style.display = 'none';
  document.querySelector('.progress-wrap').style.display = 'none';

  const correct = answers.filter((a, i) => a !== null && a === questions[i].ans).length;
  const wrong   = answers.filter((a, i) => a !== null && a !== questions[i].ans).length;
  const unanswered = answers.filter(a => a === null).length;
  const total   = questions.length;
  const pct     = Math.round(correct/total*100);

  document.getElementById('scorePercent').textContent = pct + '%';
  document.getElementById('statCorrect').textContent   = correct;
  document.getElementById('statWrong').textContent     = wrong;
  document.getElementById('statUnanswered').textContent = unanswered;

  document.getElementById('results').classList.add('show');
}

function restart() {
  answers = new Array(questions.length).fill(null);
  locked  = new Array(questions.length).fill(false);
  current = 0;
  saveState();

  document.getElementById('quizCard').style.display = '';
  document.querySelector('.nav').style.display = '';
  document.getElementById('dotNav').style.display = '';
  document.querySelector('.progress-wrap').style.display = '';
  document.getElementById('results').classList.remove('show');
  render();
}

// Init
loadState();
render();
</script>
