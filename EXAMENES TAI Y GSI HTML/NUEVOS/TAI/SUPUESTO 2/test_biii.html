<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0e0e12;
    --surface: #17171f;
    --border: #2a2a38;
    --accent: #7c3aed;
    --accent2: #06b6d4;
    --correct: #10b981;
    --wrong: #ef4444;
    --unanswered: #f59e0b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }

  header {
    width: 100%;
    max-width: 780px;
    margin-bottom: 32px;
    text-align: center;
  }

  header h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }

  /* Progress bar */
  #progress-wrap {
    width: 100%;
    max-width: 780px;
    margin-bottom: 28px;
  }

  #progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 8px;
    font-family: 'Space Mono', monospace;
  }

  #progress-bar-outer {
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }

  #progress-bar-inner {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 999px;
    transition: width .4s ease;
  }

  /* Card */
  #card {
    width: 100%;
    max-width: 780px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 40px;
    animation: fadeSlide .3s ease;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  #question-tag {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    color: var(--accent2);
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  #question-text {
    font-size: clamp(1rem, 2.2vw, 1.18rem);
    font-weight: 700;
    line-height: 1.55;
    margin-bottom: 28px;
  }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 12px; }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
    user-select: none;
  }

  .option:hover:not(.disabled) {
    border-color: var(--accent);
    background: #1a1a28;
    transform: translateX(3px);
  }

  .option-letter {
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--accent);
    min-width: 20px;
    padding-top: 2px;
  }

  .option-text { font-size: 0.95rem; line-height: 1.5; }

  .option.correct  { border-color: var(--correct); background: #0d2b22; }
  .option.wrong    { border-color: var(--wrong);   background: #2b0d0d; }
  .option.reveal   { border-color: var(--correct); background: #0d2b22; }
  .option.disabled { cursor: default; }

  /* Feedback */
  #feedback {
    margin-top: 20px;
    padding: 14px 18px;
    border-radius: var(--radius);
    font-size: 0.9rem;
    font-weight: 600;
    display: none;
  }

  #feedback.correct { background: #0d2b22; color: var(--correct); border: 1px solid var(--correct); display: block; }
  #feedback.wrong   { background: #2b0d0d; color: var(--wrong);   border: 1px solid var(--wrong);   display: block; }

  /* Navigation */
  #nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 30px;
    gap: 12px;
  }

  .btn {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 12px 28px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .btn:hover { opacity: .85; transform: scale(1.02); }
  .btn:active { transform: scale(.97); }

  #btn-prev { background: var(--border); color: var(--text); }
  #btn-next { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  #btn-finish { background: linear-gradient(135deg, var(--unanswered), #f97316); color: #fff; }
  .btn:disabled { opacity: .3; cursor: not-allowed; transform: none; }

  #skip-label { font-size: 0.78rem; color: var(--muted); font-family: 'Space Mono', monospace; }

  /* Results */
  #results {
    width: 100%;
    max-width: 780px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 40px;
    text-align: center;
    display: none;
    animation: fadeSlide .4s ease;
  }

  #results h2 {
    font-size: 2rem;
    font-weight: 800;
    margin-bottom: 8px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  #results .subtitle { color: var(--muted); margin-bottom: 40px; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 40px;
  }

  .stat-box {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 16px;
  }

  .stat-box .num {
    font-size: 2.6rem;
    font-weight: 800;
    font-family: 'Space Mono', monospace;
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat-box .label { font-size: 0.82rem; color: var(--muted); }
  .stat-box.correct-box  { border-color: var(--correct); }
  .stat-box.correct-box  .num { color: var(--correct); }
  .stat-box.wrong-box    { border-color: var(--wrong); }
  .stat-box.wrong-box    .num { color: var(--wrong); }
  .stat-box.skip-box     { border-color: var(--unanswered); }
  .stat-box.skip-box     .num { color: var(--unanswered); }

  #score-bar-wrap { margin-bottom: 36px; }
  #score-bar-wrap p { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }
  #score-bar-outer { height: 12px; background: var(--border); border-radius: 999px; overflow: hidden; }
  #score-bar-inner { height: 100%; border-radius: 999px; transition: width 1s ease; background: linear-gradient(90deg, var(--correct), var(--accent2)); }

  #btn-restart {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    padding: 14px 40px;
    font-size: 1rem;
  }

  @media(max-width:540px) {
    #card, #results { padding: 24px 20px; }
    .stats-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

// ─── Deduplicación por texto de pregunta ────────────────────────────────────
const seen = new Set();
const questions = QUESTIONS.filter(q => {
  const key = q.q.trim().toLowerCase();
  if (seen.has(key)) return false;
  seen.add(key);
  return true;
});

// ─── Estado ─────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'test_biii_answers_v1';
let current = 0;
let answers = new Array(questions.length).fill(null); // null = sin contestar, number = índice opción

function loadStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      if (data.answers && data.answers.length === questions.length) {
        answers = data.answers;
      }
    }
  } catch(e) {}
}

function saveStorage() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ answers })); } catch(e) {}
}

// ─── DOM refs ────────────────────────────────────────────────────────────────
const cardEl       = document.getElementById('card');
const resultsEl    = document.getElementById('results');
const qtag         = document.getElementById('question-tag');
const qtext        = document.getElementById('question-text');
const optsEl       = document.getElementById('options-container');
const feedbackEl   = document.getElementById('feedback');
const btnPrev      = document.getElementById('btn-prev');
const btnNext      = document.getElementById('btn-next');
const btnFinish    = document.getElementById('btn-finish');
const skipLabel    = document.getElementById('skip-label');
const progText     = document.getElementById('prog-text');
const progPct      = document.getElementById('prog-pct');
const progBar      = document.getElementById('progress-bar-inner');
const subtitleCnt  = document.getElementById('subtitle-count');

subtitleCnt.textContent = `${questions.length} preguntas · responde a tu ritmo`;

// ─── Render pregunta ─────────────────────────────────────────────────────────
const LETTERS = ['A', 'B', 'C', 'D'];

function render() {
  const q = questions[current];
  const answered = answers[current];
  const total = questions.length;

  // Progress
  const answered_count = answers.filter(a => a !== null).length;
  const pct = Math.round((current + 1) / total * 100);
  progText.textContent = `Pregunta ${current + 1} de ${total}`;
  progPct.textContent = `${pct}%`;
  progBar.style.width = pct + '%';

  // Question
  qtag.textContent = q.t;
  qtext.textContent = q.q;

  // Options
  optsEl.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option' + (answered !== null ? ' disabled' : '');
    if (answered !== null) {
      if (i === q.ans) div.classList.add(answered === i ? 'correct' : 'reveal');
      else if (i === answered) div.classList.add('wrong');
    }
    div.innerHTML = `<span class="option-letter">${LETTERS[i]}</span><span class="option-text">${opt}</span>`;
    if (answered === null) {
      div.addEventListener('click', () => selectAnswer(i));
    }
    optsEl.appendChild(div);
  });

  // Feedback
  feedbackEl.className = '';
  feedbackEl.style.display = 'none';
  if (answered !== null) {
    if (answered === q.ans) {
      feedbackEl.className = 'correct';
      feedbackEl.textContent = '✓ ¡Correcto!';
    } else {
      feedbackEl.className = 'wrong';
      feedbackEl.textContent = `✗ Incorrecto. La respuesta correcta es: ${LETTERS[q.ans]}) ${q.opts[q.ans]}`;
    }
  }

  // Nav buttons
  btnPrev.disabled = current === 0;
  const isLast = current === total - 1;
  btnNext.style.display = isLast ? 'none' : '';
  btnFinish.style.display = isLast ? '' : 'none';

  // Skip label
  const unanswered = answers.filter(a => a === null).length;
  skipLabel.textContent = unanswered > 0 ? `${unanswered} sin contestar` : '';
}

function selectAnswer(i) {
  answers[current] = i;
  saveStorage();
  render();
}

btnPrev.addEventListener('click', () => { if (current > 0) { current--; render(); } });
btnNext.addEventListener('click', () => { if (current < questions.length - 1) { current++; render(); } });
btnFinish.addEventListener('click', showResults);

function showResults() {
  let correct = 0, wrong = 0, skip = 0;
  answers.forEach((a, i) => {
    if (a === null) skip++;
    else if (a === questions[i].ans) correct++;
    else wrong++;
  });

  cardEl.style.display = 'none';
  document.getElementById('progress-wrap').style.display = 'none';
  resultsEl.style.display = 'block';

  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-wrong').textContent = wrong;
  document.getElementById('res-skip').textContent = skip;

  const pct = Math.round(correct / questions.length * 100);
  document.getElementById('score-pct-text').textContent = `Nota: ${correct} / ${questions.length}  (${pct}%)`;
  setTimeout(() => { document.getElementById('score-bar-inner').style.width = pct + '%'; }, 100);
}

document.getElementById('btn-restart').addEventListener('click', () => {
  answers = new Array(questions.length).fill(null);
  current = 0;
  saveStorage();
  cardEl.style.display = '';
  document.getElementById('progress-wrap').style.display = '';
  resultsEl.style.display = 'none';
  render();
});

// ─── Init ────────────────────────────────────────────────────────────────────
loadStorage();
render();
</script>
