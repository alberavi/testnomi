<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAI · Simulacro 24/TAI-LI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0d0f14;
    --surface: #161a23;
    --surface2: #1e2330;
    --border: #2a3045;
    --accent: #4ade80;
    --accent2: #f97316;
    --danger: #ef4444;
    --muted: #64748b;
    --text: #e2e8f0;
    --text2: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: -0.02em;
    color: var(--accent);
  }
  .logo span { color: var(--text2); font-weight: 400; }

  .header-info {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 0.8rem;
    color: var(--text2);
  }

  .counter-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    color: var(--accent);
  }

  /* PROGRESS BAR */
  .progress-wrap {
    height: 3px;
    background: var(--border);
    position: sticky;
    top: 57px;
    z-index: 99;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #22d3ee);
    transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1);
  }

  /* SECTION SELECTOR */
  .section-selector {
    display: flex;
    gap: 8px;
    padding: 20px 28px 0;
    flex-wrap: wrap;
  }
  .section-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.2s;
  }
  .section-btn:hover { border-color: var(--accent); color: var(--accent); }
  .section-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }

  /* MAIN LAYOUT */
  main {
    display: grid;
    grid-template-columns: 1fr 260px;
    gap: 24px;
    padding: 28px;
    flex: 1;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
  }

  /* QUESTION CARD */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .question-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }

  .q-number {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 2rem;
    color: var(--accent);
    line-height: 1;
  }

  .q-section-tag {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    padding: 3px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .question-text {
    font-size: 1.05rem;
    line-height: 1.65;
    color: var(--text);
    margin-bottom: 28px;
    font-weight: 400;
  }

  .options-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-label {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 18px;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.18s;
    background: transparent;
    position: relative;
    overflow: hidden;
  }

  .option-label:hover {
    border-color: var(--accent);
    background: rgba(74, 222, 128, 0.04);
  }

  .option-label input[type="radio"] {
    display: none;
  }

  .option-letter {
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 0.8rem;
    color: var(--muted);
    min-width: 22px;
    padding-top: 2px;
    transition: color 0.18s;
  }

  .option-text {
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--text2);
    transition: color 0.18s;
  }

  .option-label.selected {
    border-color: var(--accent);
    background: rgba(74, 222, 128, 0.08);
  }
  .option-label.selected .option-letter { color: var(--accent); }
  .option-label.selected .option-text { color: var(--text); }

  /* Results mode */
  .option-label.correct {
    border-color: var(--accent) !important;
    background: rgba(74, 222, 128, 0.12) !important;
  }
  .option-label.correct .option-letter { color: var(--accent) !important; }
  .option-label.correct .option-text { color: var(--text) !important; }

  .option-label.wrong {
    border-color: var(--danger) !important;
    background: rgba(239, 68, 68, 0.1) !important;
  }
  .option-label.wrong .option-letter { color: var(--danger) !important; }
  .option-label.wrong .option-text { color: var(--text) !important; }

  /* NAV BUTTONS */
  .nav-btns {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 32px;
    gap: 12px;
  }

  .btn {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-ghost {
    background: var(--surface2);
    color: var(--text2);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  .btn-primary {
    background: var(--accent);
    color: #000;
  }
  .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }

  .btn-danger {
    background: var(--danger);
    color: #fff;
  }
  .btn-danger:hover { opacity: 0.88; }

  .q-position {
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    color: var(--muted);
  }

  /* SIDEBAR */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .sidebar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
  }

  .sidebar-title {
    font-family: 'Syne', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .grid-nav {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 5px;
  }

  .grid-btn {
    aspect-ratio: 1;
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .grid-btn:hover { border-color: var(--accent); color: var(--accent); }
  .grid-btn.answered { background: var(--surface2); color: var(--text); border-color: var(--border); }
  .grid-btn.current { border-color: var(--accent); color: var(--accent); background: rgba(74,222,128,0.08); }
  .grid-btn.answered.current { border-color: var(--accent); }

  .stats-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    margin-bottom: 8px;
  }
  .stats-row span:first-child { color: var(--text2); }
  .stats-row span:last-child { font-family: 'DM Mono', monospace; color: var(--accent); }

  .btn-finish {
    width: 100%;
    justify-content: center;
    margin-top: 4px;
  }

  /* RESULTS SCREEN */
  #results-screen {
    display: none;
    padding: 40px 28px;
    max-width: 860px;
    margin: 0 auto;
    width: 100%;
    animation: fadeIn 0.4s ease;
  }

  .results-hero {
    text-align: center;
    margin-bottom: 48px;
  }

  .results-hero h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 2.8rem;
    margin-bottom: 8px;
    letter-spacing: -0.03em;
  }

  .results-hero p {
    color: var(--text2);
    font-size: 1rem;
  }

  .score-big {
    font-size: 5rem;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
    margin: 16px 0 4px;
  }

  .score-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 40px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    text-align: center;
  }

  .stat-card .stat-num {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 2.4rem;
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat-card .stat-lbl {
    font-size: 0.8rem;
    color: var(--text2);
  }

  .stat-card.good .stat-num { color: var(--accent); }
  .stat-card.bad .stat-num { color: var(--danger); }
  .stat-card.neutral .stat-num { color: var(--muted); }

  .results-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 48px;
  }

  /* Review list in results */
  .review-section {
    margin-top: 8px;
  }

  .review-section h2 {
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--text2);
  }

  .review-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 12px;
  }

  .review-item.correct { border-left: 3px solid var(--accent); }
  .review-item.wrong { border-left: 3px solid var(--danger); }
  .review-item.skipped { border-left: 3px solid var(--muted); }

  .review-item .q-hdr {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
  }

  .review-item .q-txt {
    font-size: 0.88rem;
    line-height: 1.5;
    color: var(--text2);
    flex: 1;
  }

  .review-badge {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    padding: 3px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .badge-correct { background: rgba(74,222,128,0.15); color: var(--accent); }
  .badge-wrong { background: rgba(239,68,68,0.15); color: var(--danger); }
  .badge-skip { background: rgba(100,116,139,0.2); color: var(--muted); }

  .review-ans {
    font-size: 0.8rem;
    margin-top: 6px;
  }
  .review-ans span { font-family: 'DM Mono', monospace; }
  .review-ans .your-ans { color: var(--danger); }
  .review-ans .right-ans { color: var(--accent); }

  /* Nota calculada */
  .nota-info {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 24px;
    font-size: 0.88rem;
    color: var(--text2);
    line-height: 1.7;
  }
  .nota-info strong { color: var(--text); }
  .nota-info .nota-value {
    font-family: 'Syne', sans-serif;
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--accent);
    display: block;
    margin-top: 8px;
  }

  /* Responsive */
  @media (max-width: 768px) {
    main { grid-template-columns: 1fr; }
    .sidebar { order: -1; }
    .stats-grid { grid-template-columns: repeat(3, 1fr); }
    .score-big { font-size: 3.5rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">forja<span>TIC</span> · TAI-LI 2024</div>
  <div class="header-info">
    <div class="counter-badge" id="answered-count">0 / 0 contestadas</div>
  </div>
</header>
<div class="progress-wrap">
  <div class="progress-bar" id="progress-bar" style="width:0%"></div>
</div>

<!-- SECTION SELECTOR -->
<div class="section-selector" id="section-selector">
  <button class="section-btn active" onclick="switchSection('parte1')">Parte I (1–80)</button>
  <button class="section-btn" onclick="switchSection('reserva1')">Reserva P1 (5)</button>
  <button class="section-btn" onclick="switchSection('supuesto1')">Supuesto I (20)</button>
  <button class="section-btn" onclick="switchSection('reserva_s1')">Reserva S1 (5)</button>
  <button class="section-btn" onclick="switchSection('supuesto2')">Supuesto II (20)</button>
  <button class="section-btn" onclick="switchSection('reserva_s2')">Reserva S2 (5)</button>
</div>

<main id="main-layout">
  <!-- QUESTION CARD -->
  <div class="question-card" id="question-card">
    <div class="question-meta">
      <div class="q-number" id="q-number">01</div>
      <div class="q-section-tag" id="q-section-tag">Parte I</div>
    </div>
    <div class="question-text" id="question-text"></div>
    <div class="options-list" id="options-list"></div>
    <div class="nav-btns">
      <button class="btn btn-ghost" onclick="prevQuestion()">← Anterior</button>
      <span class="q-position" id="q-position"></span>
      <button class="btn btn-primary" onclick="nextQuestion()">Siguiente →</button>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-card">
      <div class="sidebar-title">Navegación rápida</div>
      <div class="grid-nav" id="grid-nav"></div>
    </div>
    <div class="sidebar-card">
      <div class="sidebar-title">Progreso</div>
      <div class="stats-row"><span>Contestadas</span><span id="sb-answered">0</span></div>
      <div class="stats-row"><span>Sin contestar</span><span id="sb-blank">0</span></div>
      <div class="stats-row"><span>Total sección</span><span id="sb-total">0</span></div>
      <button class="btn btn-danger btn-finish" onclick="showResults()">📊 Ver resultados</button>
      <button class="btn btn-ghost btn-finish" style="margin-top:8px" onclick="resetAll()">🔄 Reiniciar todo</button>
    </div>
  </div>
</main>

<!-- RESULTS SCREEN -->
<div id="results-screen">
  <div class="results-hero">
    <p class="score-label">Puntuación estimada</p>
    <div class="score-big" id="r-score">—</div>
    <p id="r-score-sub" style="color:var(--muted);font-family:'DM Mono',monospace;font-size:0.8rem"></p>
  </div>

  <div class="stats-grid">
    <div class="stat-card good">
      <div class="stat-num" id="r-correct">0</div>
      <div class="stat-lbl">✓ Correctas</div>
    </div>
    <div class="stat-card bad">
      <div class="stat-num" id="r-wrong">0</div>
      <div class="stat-lbl">✗ Incorrectas</div>
    </div>
    <div class="stat-card neutral">
      <div class="stat-num" id="r-blank">0</div>
      <div class="stat-lbl">— Sin contestar</div>
    </div>
  </div>

  <div class="nota-info" id="nota-info"></div>

  <div class="results-actions">
    <button class="btn btn-ghost" onclick="backToTest()">← Volver al test</button>
    <button class="btn btn-danger" onclick="resetAll()">🔄 Reiniciar todo</button>
  </div>

  <div class="review-section">
    <h2>Revisión de respuestas</h2>
    <div id="review-list"></div>
  </div>
</div>

<script>
// ============================================================
// DATA: ALL QUESTIONS
// ============================================================
const SECTIONS = {
  parte1: { label: 'Parte I', color: '#4ade80' },
  reserva1: { label: 'Reserva P1', color: '#22d3ee' },
  supuesto1: { label: 'Supuesto I', color: '#f97316' },
  reserva_s1: { label: 'Reserva S1', color: '#f97316' },
  supuesto2: { label: 'Supuesto II', color: '#a78bfa' },
  reserva_s2: { label: 'Reserva S2', color: '#a78bfa' },
};

const ALL_QUESTIONS = [
// ---- PARTE I (1-80) ----
{ id:'p1_1', section:'parte1', q:'Según el artículo 62 de la Constitución Española de 1978, corresponde al Rey:', opts:['Refrendar los actos del Presidente del Gobierno.','Controlar la acción del Gobierno.','Nombrar y separar a los miembros del Gobierno.','Proponer al Presidente del Gobierno la disolución de las Cortes Generales.'], correct:3 },
{ id:'p1_2', section:'parte1', q:'Según el artículo 161 de la Constitución Española de 1978, el Tribunal Constitucional:', opts:['Dicta sentencias que pueden ser objeto de recurso por los órganos colegiados ejecutivos de las Comunidades Autónomas.','Es competente para conocer de los conflictos de competencia entre el Estado y las Comunidades Autónomas o de los de éstas entre sí.','Es el órgano jurisdiccional superior en todos los órdenes.','Tiene jurisdicción en aquellas Comunidades Autónomas que explícitamente lo reconozcan en sus Estatutos de Autonomía.'], correct:1 },
{ id:'p1_3', section:'parte1', q:'Conforme al artículo 55 de la Constitución Española de 1978, el derecho de los españoles a circular por el territorio nacional:', opts:['Es un derecho fundamental que no puede ser suspendido.','Podrá ser suspendido para personas determinadas, en relación con las investigaciones correspondientes a la actuación de bandas armadas o elementos terroristas.','Podrá ser limitado por motivos políticos.','Podrá ser suspendido cuando se acuerde la declaración del estado de excepción o de sitio.'], correct:3 },
{ id:'p1_4', section:'parte1', q:'Según la Constitución Española de 1978, es un derecho fundamental:', opts:['El derecho a la negociación colectiva laboral.','El derecho a comunicar o recibir libremente información veraz por cualquier medio de difusión.','El derecho a contraer matrimonio con plena igualdad jurídica.','El derecho a disfrutar de un medio ambiente adecuado para el desarrollo de la persona.'], correct:1 },
{ id:'p1_5', section:'parte1', q:'Según la Ley Orgánica 3/1981, de 6 de abril, del Defensor del Pueblo, podrá dirigirse al Defensor del Pueblo:', opts:['Toda persona natural o jurídica que invoque un interés legítimo, sin restricción alguna.','Toda persona natural o jurídica que invoque un interés legítimo, siempre que sean nacionales españoles o residentes en España.','Toda persona natural que invoque un interés legítimo, pero no las personas jurídicas.','Toda persona natural que invoque un interés legítimo, excepto las personas menores de edad.'], correct:0 },
{ id:'p1_6', section:'parte1', q:'Según el Título III de la Constitución Española de 1978, las Cortes Generales:', opts:['Ejercen el poder ejecutivo del Estado y aprueban sus Presupuestos.','Controlan la acción del Gobierno.','Son elegidas por sufragio universal, libre, indirecto y secreto.','Se rigen por sus Reglamentos aprobados por el Consejo de Ministros.'], correct:1 },
{ id:'p1_7', section:'parte1', q:'De acuerdo con el Real Decreto Legislativo 5/2015, texto refundido de la Ley del Estatuto básico del Empleado Público:', opts:['La condición de personal eventual no podrá constituir mérito para el acceso a la Función Pública o para la promoción interna.','El personal eventual no tiene derecho a la adopción de medidas que favorezcan la conciliación de su vida personal, familiar y laboral.','Al personal eventual le será aplicable, en lo que sea adecuado a la naturaleza de su condición, el régimen general de los funcionarios interinos.','El personal eventual no podrá percibir indemnizaciones por razón del servicio.'], correct:0 },
{ id:'p1_8', section:'parte1', q:'¿Cuál es la opción correcta según el artículo 99 de la Constitución Española de 1978?', opts:['Si transcurrido el plazo de dos meses, a partir de la primera votación de investidura, ningún candidato hubiere obtenido la confianza del Congreso, el Rey disolverá ambas Cámaras y convocará nuevas elecciones con el refrendo del Presidente del Congreso.','Si transcurrido el plazo de tres meses, a partir de la primera votación de investidura, ningún candidato hubiere obtenido la confianza del Congreso, el Rey disolverá ambas Cámaras y convocará nuevas elecciones con el refrendo del Presidente del Congreso.','Si transcurrido el plazo de dos meses, a partir de la primera votación de investidura, ningún candidato hubiere obtenido la confianza del Senado, el Rey disolverá ambas Cámaras y convocará nuevas elecciones con el refrendo del Presidente del Congreso.','Si transcurrido el plazo de tres meses, a partir de la primera votación de investidura, ningún candidato hubiere obtenido la confianza del Senado, el Rey disolverá ambas Cámaras y convocará nuevas elecciones con el refrendo del Presidente del Congreso.'], correct:0 },

// ============================================================
// STATE
// ============================================================
const STORAGE_KEY = 'tai_simulacro_v2';
let state = {
  answers: {}, // { questionId: optionIndex }
  currentSection: 'parte1',
  currentIndex: 0
};

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      state.answers = parsed.answers || {};
    }
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ answers: state.answers }));
  } catch(e) {}
}

// ============================================================
// SECTION LOGIC
// ============================================================
function getQuestionsForSection(section) {
  return ALL_QUESTIONS.filter(q => q.section === section);
}

function switchSection(section) {
  state.currentSection = section;
  state.currentIndex = 0;
  // Update buttons
  document.querySelectorAll('.section-btn').forEach((btn, i) => {
    btn.classList.toggle('active', ['parte1','reserva1','supuesto1','reserva_s1','supuesto2','reserva_s2'][i] === section);
  });
  renderQuestion();
  renderGrid();
  updateStats();
}

// ============================================================
// RENDER
// ============================================================
function renderQuestion() {
  const qs = getQuestionsForSection(state.currentSection);
  if (!qs.length) return;
  const idx = state.currentIndex;
  const q = qs[idx];
  const letters = ['a','b','c','d'];
  const sec = SECTIONS[state.currentSection];

  document.getElementById('q-number').textContent = String(idx + 1).padStart(2, '0');
  document.getElementById('q-section-tag').textContent = sec.label;
  document.getElementById('q-section-tag').style.borderColor = sec.color + '44';
  document.getElementById('q-section-tag').style.color = sec.color;
  document.getElementById('question-text').textContent = q.q;
  document.getElementById('q-position').textContent = `${idx + 1} / ${qs.length}`;

  const chosen = state.answers[q.id];
  const ol = document.getElementById('options-list');
  ol.innerHTML = '';

  q.opts.forEach((opt, i) => {
    const lbl = document.createElement('label');
    lbl.className = 'option-label' + (chosen === i ? ' selected' : '');
    lbl.innerHTML = `
      <input type="radio" name="opt" value="${i}" ${chosen === i ? 'checked' : ''}>
      <span class="option-letter">${letters[i]})</span>
      <span class="option-text">${opt}</span>
    `;
    lbl.addEventListener('click', () => {
      state.answers[q.id] = i;
      saveState();
      renderQuestion();
      renderGrid();
      updateStats();
    });
    ol.appendChild(lbl);
  });

  // Update progress bar
  const total = ALL_QUESTIONS.length;
  const answered = Object.keys(state.answers).length;
  document.getElementById('progress-bar').style.width = (answered / total * 100) + '%';
  document.getElementById('answered-count').textContent = `${answered} / ${total} contestadas`;
}

function renderGrid() {
  const qs = getQuestionsForSection(state.currentSection);
  const grid = document.getElementById('grid-nav');
  grid.innerHTML = '';
  qs.forEach((q, i) => {
    const btn = document.createElement('button');
    btn.className = 'grid-btn' 
      + (state.answers[q.id] !== undefined ? ' answered' : '')
      + (i === state.currentIndex ? ' current' : '');
    btn.textContent = i + 1;
    btn.addEventListener('click', () => {
      state.currentIndex = i;
      renderQuestion();
      renderGrid();
    });
    grid.appendChild(btn);
  });
}

function updateStats() {
  const qs = getQuestionsForSection(state.currentSection);
  const answered = qs.filter(q => state.answers[q.id] !== undefined).length;
  document.getElementById('sb-answered').textContent = answered;
  document.getElementById('sb-blank').textContent = qs.length - answered;
  document.getElementById('sb-total').textContent = qs.length;
}

function prevQuestion() {
  if (state.currentIndex > 0) {
    state.currentIndex--;
    renderQuestion();
    renderGrid();
  }
}

function nextQuestion() {
  const qs = getQuestionsForSection(state.currentSection);
  if (state.currentIndex < qs.length - 1) {
    state.currentIndex++;
    renderQuestion();
    renderGrid();
  }
}

// ============================================================
// RESULTS
// ============================================================
function showResults() {
  let correct = 0, wrong = 0, blank = 0;
  ALL_QUESTIONS.forEach(q => {
    const ans = state.answers[q.id];
    if (ans === undefined) blank++;
    else if (ans === q.correct) correct++;
    else wrong++;
  });

  const total = ALL_QUESTIONS.length;
  // Puntuación: correctas - incorrectas/3
  const raw = correct - wrong / 3;
  const score = Math.max(0, raw).toFixed(2);

  document.getElementById('r-correct').textContent = correct;
  document.getElementById('r-wrong').textContent = wrong;
  document.getElementById('r-blank').textContent = blank;
  document.getElementById('r-score').textContent = score;
  document.getElementById('r-score-sub').textContent = `sobre ${total} preguntas totales`;

  document.getElementById('nota-info').innerHTML = `
    <strong>Cálculo de puntuación:</strong><br>
    Correctas: <strong>${correct}</strong> × 1 = <strong>${correct}</strong><br>
    Incorrectas: <strong>${wrong}</strong> × 1/3 = <strong>${(wrong/3).toFixed(2)}</strong> (penalización)<br>
    En blanco: <strong>${blank}</strong> × 0 = 0<br>
    <span class="nota-value">${score} puntos (${(raw/total*10).toFixed(2)} sobre 10)</span>
  `;

  // Review list
  const rl = document.getElementById('review-list');
  rl.innerHTML = '';
  ALL_QUESTIONS.forEach((q, i) => {
    const ans = state.answers[q.id];
    const isCorrect = ans === q.correct;
    const isBlank = ans === undefined;
    const cls = isBlank ? 'skipped' : (isCorrect ? 'correct' : 'wrong');
    const badge = isBlank ? '<span class="review-badge badge-skip">— Sin contestar</span>'
      : isCorrect ? '<span class="review-badge badge-correct">✓ Correcta</span>'
      : '<span class="review-badge badge-wrong">✗ Incorrecta</span>';
    const letters = ['a','b','c','d'];
    const secLabel = SECTIONS[q.section].label;
    let ansDetail = '';
    if (!isBlank && !isCorrect) {
      ansDetail = `<div class="review-ans">Tu respuesta: <span class="your-ans">${letters[ans]}) ${q.opts[ans]}</span> — Correcta: <span class="right-ans">${letters[q.correct]}) ${q.opts[q.correct]}</span></div>`;
    } else if (!isBlank && isCorrect) {
      ansDetail = `<div class="review-ans">Respuesta: <span class="right-ans">${letters[ans]}) ${q.opts[ans]}</span></div>`;
    } else {
      ansDetail = `<div class="review-ans">Correcta: <span class="right-ans">${letters[q.correct]}) ${q.opts[q.correct]}</span></div>`;
    }
    rl.innerHTML += `
      <div class="review-item ${cls}">
        <div class="q-hdr">
          <div class="q-txt"><strong>${secLabel} · P${(i+1)}</strong> — ${q.q}</div>
          ${badge}
        </div>
        ${ansDetail}
      </div>
    `;
  });

  document.getElementById('main-layout').style.display = 'none';
  document.getElementById('section-selector').style.display = 'none';
  document.getElementById('results-screen').style.display = 'block';
  window.scrollTo(0, 0);
}

function backToTest() {
  document.getElementById('main-layout').style.display = 'grid';
  document.getElementById('section-selector').style.display = 'flex';
  document.getElementById('results-screen').style.display = 'none';
}

function resetAll() {
  if (!confirm('¿Seguro que quieres reiniciar todas las respuestas?')) return;
  state.answers = {};
  state.currentSection = 'parte1';
  state.currentIndex = 0;
  saveState();
  document.getElementById('main-layout').style.display = 'grid';
  document.getElementById('section-selector').style.display = 'flex';
  document.getElementById('results-screen').style.display = 'none';
  document.querySelectorAll('.section-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === 0);
  });
  renderQuestion();
  renderGrid();
  updateStats();
}

// ============================================================
// INIT
// ============================================================
loadState();
renderQuestion();
renderGrid();
updateStats();
</script>
</body>
</html>
